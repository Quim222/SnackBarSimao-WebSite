<a class="skip-link" href="#conteudo">{{ 'nav.skip' | t }}</a>
<header class="site-header">
  <div class="container header-inner">
    <a
      routerLink="/"
      [attr.aria-label]="'Snack Bar Simão — ' + ('nav.home' | t)"
      (click)="menuOpen.set(false)"
      ><app-brand /></a
    ><button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      [attr.aria-label]="(menuOpen() ? 'nav.closeMenu' : 'nav.openMenu') | t"
      (click)="menuOpen.set(!menuOpen())"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
    <nav
      id="main-nav"
      [attr.aria-label]="'nav.home' | t"
      [class.open]="menuOpen()"
      (keydown.escape)="menuOpen.set(false)"
    >
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="menuOpen.set(false)"
        >{{ 'nav.home' | t }}</a
      ><a
        routerLink="/ementa"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="menuOpen.set(false)"
        >{{ 'nav.menu' | t }}</a
      ><a routerLink="/" fragment="galeria" (click)="menuOpen.set(false)">{{ 'nav.gallery' | t }}</a
      ><a routerLink="/" fragment="sobre" (click)="menuOpen.set(false)">{{ 'nav.about' | t }}</a
      ><a routerLink="/" fragment="contactos" (click)="menuOpen.set(false)">{{
        'nav.contact' | t
      }}</a>
    </nav>
    <div class="language-switch">
      <button
        type="button"
        [class.selected]="i18n.language() === 'pt'"
        (click)="i18n.setLanguage('pt')"
      >
        PT</button
      ><span>/</span
      ><button
        type="button"
        [class.selected]="i18n.language() === 'en'"
        (click)="i18n.setLanguage('en')"
      >
        EN
      </button>
    </div>
  </div>
</header>
<main id="conteudo" tabindex="-1"><router-outlet /></main>
<footer class="site-footer">
  <div class="container footer-top">
    <a routerLink="/" [attr.aria-label]="'Snack Bar Simão — ' + ('nav.home' | t)"><app-brand /></a>
    <p>{{ 'nav.tagline' | t }}</p>
    <a routerLink="/ementa" class="text-link">{{ 'nav.viewMenu' | t }} <app-icon name="arrow" /></a>
  </div>
  <div class="container footer-bottom">
    <span>© {{ year }} Snack Bar Simão</span><span>{{ 'nav.pause' | t }}</span>
  </div>
</footer>
